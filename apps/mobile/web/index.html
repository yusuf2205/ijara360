<!DOCTYPE html>
<html lang="ru">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Ijara360: жильцам — оплаты и обращения, сотрудникам — весь дом. На телефоне, планшете и компьютере.">
  <meta name="theme-color" content="#111111">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ijara360">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Ijara360</title>
  <style>
    html,body{margin:0;height:100%;background:#111111}
    /* Shown until the app paints its first frame: logo and a thin yellow progress line. */
    #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;background:#111111;transition:opacity .25s}
    #splash img{width:96px;height:96px;border-radius:24px}
    #splash i{display:block;width:120px;height:4px;border-radius:4px;background:#2a2a2d;overflow:hidden;position:relative}
    #splash i::after{content:'';position:absolute;inset:0;width:40%;background:#FEC123;border-radius:4px;animation:go 1.1s ease-in-out infinite}
    @keyframes go{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
    @media (prefers-reduced-motion:reduce){#splash i::after{animation:none;width:100%}}
  </style>
</head>
<body>
  <div id="splash" aria-label="Ijara360 загружается" role="status"><img src="icons/Icon-192.png" alt=""><i></i></div>
  <!-- Install offer, shown when the download page sends a computer here with ?install=1. -->
  <div id="install" hidden role="dialog" aria-label="Установка приложения"><span></span><button id="install-yes" type="button">Установить</button><button id="install-no" type="button" aria-label="Закрыть">×</button></div>
  <style>
    #install{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:10px;background:#0E1A3A;color:#fff;padding:10px 10px 10px 16px;border-radius:14px;box-shadow:0 8px 24px #0006;font:600 14px system-ui,sans-serif;max-width:calc(100vw - 32px);box-sizing:border-box}
    #install[hidden],#install button[hidden]{display:none}
    #install button{border:0;border-radius:10px;font:700 14px system-ui,sans-serif;cursor:pointer}
    #install-yes{background:#1F6BFF;color:#fff;padding:9px 14px;white-space:nowrap}
    #install-no{background:transparent;color:#ffffffb0;font-size:20px;padding:4px 8px}
  </style>
  <script>
    (function () {
      var standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
      var asked = /[?&]install=1/.test(location.search);
      var deferred = null;
      function box() { return document.getElementById('install'); }
      function show(text, canInstall) { var b = box(); if (!b || standalone) return; b.querySelector('span').textContent = text; document.getElementById('install-yes').hidden = !canInstall; b.hidden = false; }
      window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; if (asked) show('Установить Ijara360 на этот компьютер?', true); });
      window.addEventListener('appinstalled', function () { var b = box(); if (b) b.hidden = true; });
      document.addEventListener('click', function (e) {
        var id = e.target && e.target.id;
        if (id === 'install-yes' && deferred) { deferred.prompt(); deferred.userChoice.finally(function () { deferred = null; box().hidden = true; }); }
        if (id === 'install-no') box().hidden = true;
      });
      // No install prompt: Safari/Firefox can't offer one, and Chromium stays silent when it's already installed.
      if (asked && !standalone) setTimeout(function () {
        if (deferred) return;
        var safariMac = /Mac/.test(navigator.platform) && /Safari/.test(navigator.userAgent) && !/Chrome|Edg/.test(navigator.userAgent);
        show(safariMac ? 'Чтобы установить: меню «Файл» → «Добавить в Dock».' : 'Если Ijara360 ещё не установлено: меню браузера → «Установить приложение».', false);
      }, 3500);
    })();
    // Remove the splash once Flutter shows its first frame.
    window.addEventListener('flutter-first-frame', function () { var s = document.getElementById('splash'); if (s) { s.style.opacity = '0'; setTimeout(function () { s.remove(); }, 300); } });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
