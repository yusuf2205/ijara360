<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Карта</title>
  <style>
    html, body, #map { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #eef2f8; }
    #hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
      font: 600 14px/1.4 system-ui, sans-serif; color: #667085; padding: 24px; }
  </style>
  <!-- Yandex JavaScript API. The key is referer-restricted to ijara360.uz, so this page must be served from there. -->
  <script src="https://api-maps.yandex.ru/2.1/?apikey=88a04531-269e-419d-949a-c43124e42709&lang=ru_RU"></script>
</head>
<body>
  <div id="map"></div>
  <div id="hint">Загрузка карты…</div>
  <script>
    var map = null, clusterer = null, pending = null;
    var TASHKENT = [41.311081, 69.279737];

    // One channel back to the Flutter host: a JS channel on mobile (window.FlutterMarker), postMessage on web.
    function toHost(msg) {
      var s = JSON.stringify(msg);
      try { if (window.FlutterMarker && window.FlutterMarker.postMessage) { window.FlutterMarker.postMessage(s); return; } } catch (e) {}
      try { parent.postMessage(s, '*'); } catch (e) {}
    }

    function preset(status) {
      return status === 'LIVE' ? 'islands#greenCircleDotIcon'
        : status === 'STALE' ? 'islands#orangeCircleDotIcon'
        : status === 'LOCATION_DISABLED' ? 'islands#redCircleDotIcon'
        : 'islands#grayCircleDotIcon';
    }

    function render(points) {
      if (!map) { pending = points; return; }
      clusterer.removeAll();
      var marks = [];
      for (var i = 0; i < points.length; i++) {
        var p = points[i];
        var m = new ymaps.Placemark([p.lat, p.lon], { hintContent: p.label, balloonContent: p.label }, { preset: preset(p.status) });
        (function (id) { m.events.add('click', function () { toHost({ type: 'marker', id: id }); }); })(p.id);
        marks.push(m);
      }
      clusterer.add(marks);
      var hint = document.getElementById('hint');
      if (points.length === 0) { hint.textContent = 'Пока нет точек на карте — они появятся, когда жильцы включат геолокацию.'; hint.style.display = 'flex'; }
      else { hint.style.display = 'none'; }
      if (points.length === 1) { map.setCenter([points[0].lat, points[0].lon], 15); }
      else if (points.length > 1) { try { map.setBounds(clusterer.getBounds(), { checkZoomRange: true, zoomMargin: 48 }); } catch (e) {} }
    }

    function start() {
      map = new ymaps.Map('map', { center: TASHKENT, zoom: 11, controls: ['zoomControl', 'geolocationControl'] });
      clusterer = new ymaps.Clusterer({ preset: 'islands#blueClusterIcons', groupByCoordinates: false });
      map.geoObjects.add(clusterer);
      document.getElementById('hint').style.display = 'none';
      toHost({ type: 'ready' });
      if (pending) { render(pending); pending = null; }
    }

    // Points come from the host: web via postMessage, mobile via window.setPoints(json).
    window.setPoints = function (json) { try { render(JSON.parse(json)); } catch (e) {} };
    window.addEventListener('message', function (e) {
      try { var d = JSON.parse(e.data); if (d && d.type === 'points') render(d.points); } catch (_) {}
    });

    if (window.ymaps) { ymaps.ready(start); }
    else { document.getElementById('hint').textContent = 'Не удалось загрузить Яндекс Карты. Проверьте, что домен ijara360.uz добавлен к ключу.'; }
  </script>
</body>
</html>
