name: ijara360
description: "Ijara360: жильцам — оплаты и обращения, сотрудникам — весь дом."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: 8.1.1
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.1.1
  http: ^1.6.0
  intl: ^0.20.3
  latlong2: 0.9.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  web_socket_channel: ^3.0.3
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
