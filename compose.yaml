name: ijara360
services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ijara_owner
      POSTGRES_DB: ijara360
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}
    volumes:
      - ${IJARA_ROOT:-/volume1/docker/ijara360}/data/postgres:/var/lib/postgresql/data
      - ./infra/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ijara_owner -d ijara360"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build: { context: ., target: api }
    image: ijara360-api:${RELEASE_TAG:-local}
    environment:
      DATABASE_URL: postgresql://ijara_owner:${POSTGRES_PASSWORD}@db:5432/ijara360?schema=public
    # Runs as root once per deploy: prepares the private KYC directory and the server status
    # directory (written by the watchdog and the nightly backup, read by the API) for non-root users.
    command: ["sh", "-c", "install -d -m 700 -o node -g node /var/lib/ijara360/kyc && install -d -m 755 -o node -g node /var/lib/ijara360/status && node node_modules/prisma/build/index.js migrate deploy && node scripts/grant-runtime.cjs"]
    volumes:
      - ${IJARA_ROOT:-/volume1/docker/ijara360}/data/kyc:/var/lib/ijara360/kyc
      - ${IJARA_ROOT:-/volume1/docker/ijara360}/data/status:/var/lib/ijara360/status
    depends_on:
      db: {condition: service_healthy}
    restart: "no"
  api:
    image: ijara360-api:${RELEASE_TAG:-local}
    restart: unless-stopped
    user: node
    environment:
      DATABASE_URL: postgresql://ijara_app:${APP_DB_PASSWORD}@db:5432/ijara360?schema=public
      APP_ORIGIN: ${APP_ORIGIN:-https://192.168.1.105:8446}
      ADDITIONAL_APP_ORIGINS: ${ADDITIONAL_APP_ORIGINS:-}
      SETUP_TOKEN: ${SETUP_TOKEN:?Set SETUP_TOKEN}
      NODE_ENV: production
      COOKIE_SECURE: "true"
      PORT: "4000"
      # M4 applications. Losing KYC_ENCRYPTION_KEY makes stored profiles and documents unreadable.
      KYC_ENCRYPTION_KEY: ${KYC_ENCRYPTION_KEY:?Set KYC_ENCRYPTION_KEY (64 hex characters)}
      KYC_STORAGE_PATH: /var/lib/ijara360/kyc
      APPLICATION_PROPERTY_ID: ${APPLICATION_PROPERTY_ID:-}
      PUBLIC_APP_ORIGIN: ${PUBLIC_APP_ORIGIN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_MODE: ${TELEGRAM_MODE:-polling}
      SERVER_STATUS_PATH: /var/lib/ijara360/status
      # M7 geolocation (docs/M7-LOCATION.md). The map key needs a commercial Yandex licence for this use.
      YANDEX_MAPS_API_KEY: ${YANDEX_MAPS_API_KEY:-}
      LOCATION_LIVE_SECONDS: ${LOCATION_LIVE_SECONDS:-180}
      LOCATION_STALE_SECONDS: ${LOCATION_STALE_SECONDS:-2100}
      LOCATION_HISTORY_RETENTION_DAYS: ${LOCATION_HISTORY_RETENTION_DAYS:-30}
    volumes:
      - ${IJARA_ROOT:-/volume1/docker/ijara360}/data/kyc:/var/lib/ijara360/kyc
      - ${IJARA_ROOT:-/volume1/docker/ijara360}/data/status:/var/lib/ijara360/status:ro
    command: ["node", "apps/api/dist/main.js"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
  web:
    build: { context: ., target: web }
    image: ijara360-web:${RELEASE_TAG:-local}
    restart: unless-stopped
    user: node
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    command: ["node", "node_modules/next/dist/bin/next", "start", "apps/web", "-p", "3000"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
  gateway:
    image: caddy:2
    restart: unless-stopped
    # Tailscale Serve (8447, tailnet) and Funnel (8448, internet) upstreams, NAS loopback only.
    # See docs/M4-APPLICATIONS.md and docs/M6-RELIABILITY.md.
    ports: ["127.0.0.1:8447:8080", "127.0.0.1:8448:8081"]
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./infra/common.caddy:/etc/caddy/common.caddy:ro
    depends_on:
      web: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
  gateway-lan:
    image: caddy:2
    restart: unless-stopped
    # Home network. Separate from "gateway": if the NAS loses this address only the LAN entrance stops.
    # Started after "gateway", which frees 8446 when an older single-gateway release is replaced.
    ports: ["192.168.1.105:8446:443"]
    volumes:
      - ./infra/Caddyfile.lan:/etc/caddy/Caddyfile:ro
      - ./infra/common.caddy:/etc/caddy/common.caddy:ro
      # Keeps the local certificate authority the home devices already trust.
      - ${IJARA_ROOT:-/volume1/docker/ijara360}/data/caddy:/data
      - ${IJARA_ROOT:-/volume1/docker/ijara360}/data/caddy-config:/config
    depends_on:
      web: {condition: service_healthy}
      gateway: {condition: service_started}
    healthcheck:
      test: ["CMD", "wget", "-q", "--no-check-certificate", "-O", "/dev/null", "https://localhost/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
  backup:
    image: postgres:17-bookworm
    restart: unless-stopped
    # Nightly pg_dump + encrypted documents, restore-verified in a private throwaway cluster.
    # Same directory and file names as the deploy backup (scripts/backup-nas.sh).
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Tashkent
      BACKUP_AT: "03:30"
    command: ["sh", "/opt/ijara360/backup-service.sh", "loop"]
    volumes:
      - ./scripts/backup-service.sh:/opt/ijara360/backup-service.sh:ro
      - ${IJARA_ROOT:-/volume1/docker/ijara360}/data/kyc:/kyc:ro
      - ${IJARA_ROOT:-/volume1/docker/ijara360}/backups:/backups
      - ${IJARA_ROOT:-/volume1/docker/ijara360}/data/status:/status
    depends_on:
      db: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
  offsite:
    build: { context: ., dockerfile: infra/offsite.Dockerfile }
    image: ijara360-offsite:${RELEASE_TAG:-local}
    restart: unless-stopped
    # Encrypts each nightly backup with the owner's age public key and sends it to Google Drive and to
    # USB drives that carry an "Ijara360-backup" folder (docs/M6-OFFSITE.md). It cannot decrypt anything.
    environment:
      OFFSITE_AGE_RECIPIENT: ${OFFSITE_AGE_RECIPIENT:-}
      OFFSITE_REMOTE: gdrive:Ijara360-backup
      RCLONE_CONFIG_GDRIVE_TYPE: drive
      RCLONE_CONFIG_GDRIVE_SCOPE: drive.file
      RCLONE_CONFIG_GDRIVE_TOKEN: ${OFFSITE_GDRIVE_TOKEN:-}
      RCLONE_DRIVE_USE_TRASH: "false"
    volumes:
      - ${IJARA_ROOT:-/volume1/docker/ijara360}/backups:/backups:ro
      - ${IJARA_ROOT:-/volume1/docker/ijara360}/data/status:/status
      # UGOS mounts USB drives here; rslave lets a drive plugged in later appear without a restart.
      - /mnt/@usb:/usb:rslave
    depends_on:
      migrate: {condition: service_completed_successfully}
  watchdog:
    image: ijara360-api:${RELEASE_TAG:-local}
    restart: unless-stopped
    user: node
    # Checks every entrance, the database, the nightly backup and free space; tells the owners in Telegram.
    # Depends only on migrate, so it keeps running and reporting when the site itself is down.
    environment:
      DATABASE_URL: postgresql://ijara_app:${APP_DB_PASSWORD}@db:5432/ijara360?schema=public
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      SERVER_STATUS_PATH: /var/lib/ijara360/status
    command: ["node", "scripts/watchdog.cjs"]
    volumes:
      - ${IJARA_ROOT:-/volume1/docker/ijara360}/data/status:/var/lib/ijara360/status
    depends_on:
      migrate: {condition: service_completed_successfully}
