# Nightly encrypted backup of all NAS projects to the USB drive. Lives in /volume3/projects/usb-backup.
#   docker compose up -d --build
#   docker exec nas-usb-backup /backup.sh once      # a backup right now
services:
  usb-backup:
    build: .
    image: nas-usb-backup:1
    container_name: nas-usb-backup
    restart: unless-stopped
    environment:
      TZ: Asia/Tashkent
      BACKUP_AT: "04:30" # after the Ijara360 nightly dump (03:30)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /volume3/projects:/projects:ro
      - /volume1/storage:/storage
      - /volume3/@docker/volumes:/volumes:ro
      - /volume3/suhbat-db:/suhbat-db # read-write only so SQLite can share its WAL index while copying
      - /volume1/DocumentsArchive:/archive:ro
      - ./restic-password:/run/restic-password:ro
      - ./cache:/cache
      - type: bind
        source: /mnt/@usb
        target: /usb
        bind: { propagation: rslave, create_host_path: false }
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/alive -mmin -3 | grep -q . && ! test -f /tmp/failed"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
